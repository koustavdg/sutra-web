name: Site quality

on:
  push:
    branches: [aeo, main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build public site artifact
        run: python scripts/build_site.py
      - name: Validate public site artifact
        run: python scripts/check_site.py --dir _site
      - name: Verify quality gate catches a broken page
        run: python scripts/test_quality_gate.py

      - name: Validate comparison publication and preview metadata
        run: python -m unittest discover -s tests -p 'test_comparison_pages.py'
      - name: Validate static policies, product facts and publication metadata
        run: python -m unittest discover -s tests -p 'test_publication_enhancements.py'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser-test dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run mobile and desktop browser checks
        run: npm run check:browser -- --project=chromium
      - name: Measure mobile Lighthouse medians
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory _site &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          export CHROME_PATH="$(node -e "process.stdout.write(require('@playwright/test').chromium.executablePath())")"
          node scripts/lighthouse-audit.cjs

  cross-browser:
    # WebKit media codecs differ by OS. macOS gives the closest Playwright
    # approximation of Safari's native MP4 playback (not real iPhone testing).
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install chromium firefox webkit
      - name: Verify desktop and mobile-size rendering and video playback
        run: npm run check:cross-browser
      - name: Upload browser report, screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-browser-report
          path: |
            playwright-report/
            test-results/
            output/browser-preview/
          retention-days: 14
